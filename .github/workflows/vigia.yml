# Vai para `rogeriofleming/daedalus-status/.github/workflows/vigia.yml`, junto com
# `aviso_queda.mjs` e `vigia.mjs` na raiz. Segredo: DAEDALUS_EMERGENCIA_JWK.
# Ver projetos/compressor-interno/licenca/SERVIDOR_FORA_DO_AR.md.
name: vigia da licenca
on:
  # ⚠️ AGENDAMENTO DESARMADO em 02/10/2026, de propósito.
  # A Cloudflare responde `403 cf-mitigated: challenge` a requisições vindas de
  # datacenter — e o runner do GitHub é datacenter. Medido: do computador do Roger
  # a /api/saude devolve 200 com qualquer user-agent; do runner, 403 nas duas rotas.
  # Com o agendamento ligado, o vigia ficaria vermelho a cada 10 min e mandaria
  # e-mail de falha para sempre, sem o servidor ter caído uma vez.
  # RELIGAR (tirar o comentário do cron) depois que a zona rogeriofleming.com.br
  # tiver uma regra WAF de skip para /api/saude e /api/chave-publica.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: conferir o servidor e, se preciso, emitir o aviso
        id: vigia
        env:
          DAEDALUS_EMERGENCIA_JWK: ${{ secrets.DAEDALUS_EMERGENCIA_JWK }}
          DAEDALUS_CHAVE_PUBLICA_APP: ${{ vars.DAEDALUS_CHAVE_PUBLICA_APP }}
        run: node vigia.mjs
        continue-on-error: true
      - name: gravar o estado e o aviso
        run: |
          git config user.name "vigia"
          git config user.email "vigia@users.noreply.github.com"
          git add -A estado.json aviso.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "vigia: $(date -u +%FT%TZ)" && git push)
      - name: ficar vermelho quando o servidor estiver fora (o GitHub avisa por e-mail)
        if: steps.vigia.outcome == 'failure'
        run: exit 1
