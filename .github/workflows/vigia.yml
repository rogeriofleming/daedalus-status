# Vigia do servidor da licença do Daedalus.
# Fonte: projetos/compressor-interno/licenca/status/vigia.yml (o cofre é a cópia de trabalho).
# Segredo: DAEDALUS_EMERGENCIA_JWK · Variável: DAEDALUS_CHAVE_PUBLICA_APP
# Ver licenca/SERVIDOR_FORA_DO_AR.md e licenca/OPERACAO.md §6.
name: vigia da licenca
on:
  # RELIGADO em 03/10/2026. Ficou desarmado de 02/10 a 03/10 porque a zona
  # rogeriofleming.com.br responde `403 cf-mitigated: challenge` a quem vem de datacenter, e o
  # runner é datacenter — o vigia não conseguia distinguir "caiu" de "fui barrado".
  # O conserto não foi mexer no firewall: o vigia passou a decidir pelo endereço *.workers.dev do
  # mesmo Worker, que NÃO está na zona (medido do runner em 03/10: 200 por lá, 403 pelo domínio).
  # O domínio do produto continua sendo olhado — challenge nele não é queda, mas 5xx ou sem
  # resposta é, porque é por ele que o app de quem pagou fala.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: conferir o servidor e, se preciso, emitir o aviso
        id: vigia
        env:
          DAEDALUS_EMERGENCIA_JWK: ${{ secrets.DAEDALUS_EMERGENCIA_JWK }}
          DAEDALUS_CHAVE_PUBLICA_APP: ${{ vars.DAEDALUS_CHAVE_PUBLICA_APP }}
        run: node vigia.mjs
        continue-on-error: true
      - name: gravar o estado e o aviso
        run: |
          git config user.name "vigia"
          git config user.email "vigia@users.noreply.github.com"
          git add -A estado.json aviso.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "vigia: $(date -u +%FT%TZ)" && git push)
      - name: ficar vermelho quando o servidor estiver fora (o GitHub avisa por e-mail)
        if: steps.vigia.outcome == 'failure'
        run: |
          echo "O servidor da licenca do Daedalus NAO esta no ar."
          echo "O motivo sai no passo anterior, no campo 'porque' do JSON."
          echo "Manual: projetos/compressor-interno/licenca/OPERACAO.md"
          exit 1
