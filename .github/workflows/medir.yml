# TEMPORÁRIO — o endereço workers.dev escapa do challenge que a zona aplica a datacenter?
# Apagar depois de ler o resultado.
name: medir o acesso do runner
on:
  workflow_dispatch: {}
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: pelo dominio do produto (na zona — espera-se 403 challenge)
        run: |
          curl -sS -o /dev/null -w "saude pelo dominio:        %{http_code}\n" --max-time 25 \
            https://daedalus.rogeriofleming.com.br/api/saude || true
      - name: pelo endereco do vigia (fora da zona)
        run: |
          echo "--- corpo da saude pelo workers.dev ---"
          curl -sS --max-time 25 https://daedalus-licenca.rogeriofleming587.workers.dev/api/saude || true
          echo
          curl -sS -o /dev/null -w "saude pelo workers.dev:    %{http_code}\n" --max-time 25 \
            https://daedalus-licenca.rogeriofleming587.workers.dev/api/saude || true
          curl -sS -o /dev/null -w "chave-publica workers.dev: %{http_code}\n" --max-time 25 \
            https://daedalus-licenca.rogeriofleming587.workers.dev/api/chave-publica || true
          curl -sS -o /dev/null -w "admin workers.dev (404):   %{http_code}\n" --max-time 25 \
            https://daedalus-licenca.rogeriofleming587.workers.dev/admin || true
      - name: node fetch, igual ao vigia
        run: |
          node -e "fetch('https://daedalus-licenca.rogeriofleming587.workers.dev/api/saude',{cache:'no-store'}).then(async r=>{const j=await r.json().catch(()=>null);console.log('codigo',r.status,'| cf-mitigated',r.headers.get('cf-mitigated'),'| ok',j&&j.ok)}).catch(e=>console.log('erro',e.message))"
