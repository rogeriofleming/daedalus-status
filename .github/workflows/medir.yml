# TEMPORÁRIO — mede o que o runner do GitHub recebe hoje do servidor da licença.
# Apagar depois de ler o resultado.
name: medir o acesso do runner
on:
  workflow_dispatch: {}
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: saude pelo dominio do produto
        run: |
          echo "--- /api/saude (curl padrao) ---"
          curl -sS -i --max-time 25 https://daedalus.rogeriofleming.com.br/api/saude | head -30 || true
          echo
          echo "--- /api/saude (user-agent de navegador) ---"
          curl -sS -o /dev/null -w "codigo=%{http_code}\n" --max-time 25 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36" \
            https://daedalus.rogeriofleming.com.br/api/saude || true
          echo "--- /api/chave-publica ---"
          curl -sS -o /dev/null -w "codigo=%{http_code}\n" --max-time 25 \
            https://daedalus.rogeriofleming.com.br/api/chave-publica || true
          echo "--- /baixar (HEAD, so para comparar) ---"
          curl -sS -I -o /dev/null -w "codigo=%{http_code}\n" --max-time 25 \
            https://daedalus.rogeriofleming.com.br/baixar || true
          echo "--- a pagina de venda, que e Pages/assets ---"
          curl -sS -o /dev/null -w "codigo=%{http_code}\n" --max-time 25 \
            https://rogeriofleming.com.br/daedalus || true
      - name: node fetch, igual ao vigia
        run: |
          node -e "fetch('https://daedalus.rogeriofleming.com.br/api/saude',{cache:'no-store'}).then(async r=>{console.log('codigo',r.status);console.log('cf-mitigated',r.headers.get('cf-mitigated'));console.log('corpo',(await r.text()).slice(0,200))}).catch(e=>console.log('erro',e.message))"
      - name: de onde o runner fala
        run: curl -sS --max-time 20 https://api.ipify.org || true
