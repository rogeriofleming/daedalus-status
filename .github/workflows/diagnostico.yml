name: diagnostico temporario
on: { workflow_dispatch: {} }
jobs:
  olhar:
    runs-on: ubuntu-latest
    steps:
      - name: o que o GitHub recebe do servidor
        run: |
          echo "--- /api/saude ---"
          curl -s -o corpo.txt -w "http=%{http_code} ip=%{remote_ip}\n" --max-time 20 https://daedalus.rogeriofleming.com.br/api/saude
          head -c 400 corpo.txt; echo
          echo "--- /api/chave-publica ---"
          curl -s -o corpo2.txt -w "http=%{http_code}\n" --max-time 20 https://daedalus.rogeriofleming.com.br/api/chave-publica
          head -c 400 corpo2.txt; echo
          echo "--- cabecalhos da saude ---"
          curl -s -D - -o /dev/null --max-time 20 https://daedalus.rogeriofleming.com.br/api/saude | head -20
